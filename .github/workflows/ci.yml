name: CI

# legacy · load · scripts · 문서만 바뀌면 앱 테스트가 필요 없어 건너뜀
on:
  pull_request:
    paths-ignore: ['legacy/**', 'load/**', 'scripts/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['legacy/**', 'load/**', 'scripts/**', '**.md']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-pw
          MYSQL_DATABASE: hotel_booking_test
          MYSQL_USER: app
          MYSQL_PASSWORD: ci-app-pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-pw"
          --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      DB_PASSWORD: ci-app-pw
      JWT_SECRET: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 스키마와 시드 적용
        run: |
          mysql -h 127.0.0.1 -uapp -pci-app-pw hotel_booking_test < db/schema.sql
          mysql -h 127.0.0.1 -uapp -pci-app-pw hotel_booking_test < db/seed.sql

      - run: npm ci

      - name: 화면 빌드와 단위 테스트
        working-directory: web
        run: |
          npm ci
          npm run build
          npm test

      - run: npm test

      # 스키마 태스크를 RDS처럼 빈 DB에 두 번 실행. 배포마다 돌기 때문에 두 번째도 건너뛰기만 하고 0으로 끝나야 함
      - name: 스키마 태스크 두 번 실행
        env:
          DB_HOST: 127.0.0.1
          DB_ADMIN_USER: root
          DB_ADMIN_PASSWORD: ci-root-pw
          DB_APP_PASSWORD: ci-app-pw
          HOST1_PASSWORD: ci-host-pw # 호스트 계정 하나만 넣어 "있으면 만듦 · 없으면 건너뜀"을 둘 다 지나게 함
        run: |
          mysql -h 127.0.0.1 -uroot -pci-root-pw -e "CREATE DATABASE hotel_booking"
          node dist/src/migrate.js
          node dist/src/migrate.js
          test "$(mysql -h 127.0.0.1 -uapp -pci-app-pw hotel_booking -N -e "SELECT role FROM users WHERE email = 'host1@spongetrip.local'")" = host
          # 앱 계정은 테이블을 지울 수 없어야 함 (읽기 · 쓰기만)
          if mysql -h 127.0.0.1 -uapp -pci-app-pw hotel_booking -e "DROP TABLE reviews"; then
            echo "앱 계정에 DROP 권한이 있음" >&2; exit 1
          fi

      - name: 이미지 빌드 확인
        run: docker build -t hotel-booking-app .

  # main push에서 테스트를 통과하면 배포. 배포 단계는 인프라팀이 제공한 cd.yml (인프라 ADR-046)
  # 같은 실행 안에서 이어지므로 PR은 배포되지 않음. 불러낸 워크플로가 OIDC 토큰을 받으려면 여기서 id-token을 줘야 함
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cd.yml
    permissions:
      id-token: write
      contents: read
