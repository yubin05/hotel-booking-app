# 로컬 개발용. 아래 비밀번호는 로컬 전용 값이다.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-pw
      MYSQL_DATABASE: hotel_booking
      MYSQL_USER: app
      MYSQL_PASSWORD: local-app-pw
    ports:
      - "3306:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
      - ./db/test-db.sh:/docker-entrypoint-initdb.d/3-test-db.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root-pw"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DB_HOST: db
      DB_PASSWORD: local-app-pw
      JWT_SECRET: local-only-jwt-secret
      # 결제 · 알림 외부 서비스 키. 저장소에 올리지 않는 .env 파일에서 읽고, 없으면 그 기능만 꺼진다(.env.example 참고)
      APP_URL: ${APP_URL:-http://localhost:3000}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
